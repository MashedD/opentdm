name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its older, unfinished run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck build.sh .ci/*.sh

  linux:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install dependencies
        timeout-minutes: 10
        run: .ci/apt-install.sh make pkg-config ${{ matrix.cc }} libcurl4-openssl-dev
      - name: Build
        run: ./build.sh linux
        env:
          CC: ${{ matrix.cc }}
      - name: Build without libcurl
        run: make -j"$(nproc)" USE_CURL=0 TARGET=game-nocurl.so
        env:
          CC: ${{ matrix.cc }}
      - uses: actions/upload-artifact@v7
        with:
          name: opentdm-linux-${{ runner.arch }}-${{ matrix.cc }}
          path: game*.so
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [win32, win64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: .deps
          key: curl-${{ matrix.arch }}-${{ hashFiles('.ci/build-curl.sh') }}
      - name: Install dependencies
        timeout-minutes: 10
        run: .ci/apt-install.sh make pkg-config gcc-mingw-w64 binutils-mingw-w64
      - name: Build
        run: ./build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: opentdm-${{ matrix.arch }}
          path: game*.dll
          if-no-files-found: error
          retention-days: 30
